<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Launch Radar — pre-token protocols ranked by implied launch value</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="wordmark">LAUNCH<span class="cursor">_</span>RADAR</div>
    <div class="tagline">Every protocol that records no token yet, priced as if it launched today — and what to do about each one.</div>
  </div>
  <div class="stats" id="stats"></div>
</header>

<section class="modelbar" id="modelbar"></section>

<section class="evidence" id="evidence" aria-label="What the market pays, by category"></section>

<nav class="controls" id="controls">
  <div class="tabs" role="tablist">
    <button class="tab on" id="tab-board" type="button">Pre-token board</button>
    <button class="tab" id="tab-live" type="button">Already trading</button>
  </div>
  <input class="search" id="q" type="search" placeholder="Search name or slug…" autocomplete="off">
  <select class="sel" id="f-category" aria-label="Category"></select>
  <select class="sel" id="f-chain" aria-label="Chain"></select>
  <div class="chips" id="f-tier">
    <button class="chip on" data-tier="all" type="button">All tiers</button>
    <button class="chip" data-tier="watchlist" type="button">Watchlist</button>
    <button class="chip" data-tier="early" type="button">Early</button>
    <button class="chip" data-tier="product" type="button">Product-flagged</button>
  </div>
  <select class="sel" id="f-min" aria-label="Minimum implied value">
    <option value="0">Any value</option>
    <option value="1000000">Implied ≥ $1M</option>
    <option value="10000000">Implied ≥ $10M</option>
    <option value="100000000">Implied ≥ $100M</option>
  </select>
</nav>

<main>
  <div class="count" id="count"></div>
  <div class="tablewrap">
    <table class="board" id="board"></table>
    <table class="board hidden" id="liveboard"></table>
  </div>
  <p class="empty hidden" id="empty">No protocol matches those filters. Loosen one and the radar sweeps again.</p>
</main>

<aside class="drawer hidden" id="drawer" aria-label="Protocol detail"></aside>
<div class="scrim hidden" id="scrim"></div>

<footer class="foot" id="foot"></footer>

<script src="../data.js"></script>
<script src="app.js"></script>
</body>
</html>
